<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0F1923;
    color: #ECE8E1;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .box { max-width: 320px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #2a3744;
    border-top: 3px solid #16A34A;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 14px; color: #9fb0bd; }
  a { color: #16A34A; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Opening USDT pricelist...</p>
    <p><a id="fallback" href="pricelist_usdt.html">Click here if it doesn't open automatically</a></p>
  </div>
  <script>
    const TARGET = "pricelist_usdt.html";
    
    // Direct redirect (no tracking)
    window.location.replace(TARGET);
  </script>
</body>
</html>
