<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pricelist Click Stats</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0F1923;
    color: #ECE8E1;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 32px 20px;
    box-sizing: border-box;
  }
  h2 { margin: 0 0 24px; font-size: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .card {
    background: #16212c;
    border: 1px solid #24313d;
    border-radius: 14px;
    padding: 20px 24px;
    min-width: 160px;
    flex: 1;
  }
  .label { font-size: 13px; color: #9fb0bd; margin-bottom: 8px; }
  .num { font-size: 40px; font-weight: 700; }
  .idr .num { color: #FF4655; }
  .usdt .num { color: #16A34A; }
  button {
    background: #FF4655;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .updated { font-size: 12px; color: #6b7c88; margin-top: 14px; }
  .note { font-size: 12px; color: #9fb0bd; margin-top: 24px; padding: 12px 16px; background: #16212c; border-radius: 8px; }
</style>
</head>
<body>
  <h2>📊 Pricelist Click Stats</h2>
  <p style="color: #9fb0bd; margin: 0 0 16px;">Counters reset — fresh start from Vercel deployment</p>
  
  <div class="row">
    <div class="card idr">
      <div class="label">🇮🇩 IDR Pricelist</div>
      <div class="num">0</div>
    </div>
    <div class="card usdt">
      <div class="label">💵 USDT Pricelist</div>
      <div class="num">0</div>
    </div>
  </div>
  
  <p class="note">Tracking removed — using direct redirects on Vercel instead.</p>
</body>
</html>
